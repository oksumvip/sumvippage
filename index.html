<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>网络速度测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #007bff;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>网络速度测试</h1>
  <button id="startBtn" onclick="testSpeed()">开始测速</button>
  <div id="result"></div>

  <script>
    async function testSpeed() {
      const fileSizeInBytes = 10 * 1024 * 1024; // 10 MB
      const testFileUrl = 'https://speedtest.tele2.net/10MB.zip'; // 公共测速文件

      const button = document.getElementById('startBtn');
      const resultDiv = document.getElementById('result');

      button.disabled = true;
      resultDiv.textContent = '正在测试...';

      const startTime = new Date().getTime();

      try {
        const response = await fetch(testFileUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('下载失败');

        // 强制读取整个文件（避免流式响应被优化）
        const arrayBuffer = await response.arrayBuffer();

        const endTime = new Date().getTime();
        const durationSeconds = (endTime - startTime) / 1000;

        if (durationSeconds <= 0) throw new Error('时间测量异常');

        const speedBps = fileSizeInBytes / durationSeconds; // 字节/秒
        const speedMbps = (speedBps * 8) / (1024 * 1024); // 转换为 Mbps

        resultDiv.innerHTML = `
          下载完成！<br>
          耗时: ${durationSeconds.toFixed(2)} 秒<br>
          估算下载速度: <strong>${speedMbps.toFixed(2)} Mbps</strong>
        `;
      } catch (error) {
        console.error('测速出错:', error);
        resultDiv.textContent = '测速失败，请检查网络或稍后重试。';
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
